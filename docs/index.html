<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的笔记</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #f6f8fb 0%, #eeeff6 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 640px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(30, 40, 90, .12);
    padding: 42px 40px;
  }
  h1 {
    font-size: 26px;
    color: #26324d;
    margin-bottom: 6px;
  }
  .sub {
    color: #8a93a8;
    font-size: 14px;
    margin-bottom: 26px;
  }
  a.note {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    margin-bottom: 10px;
    text-decoration: none;
    color: #2f3b57;
    background: #f4f6fb;
    border-radius: 10px;
    transition: background .15s, transform .15s;
    font-size: 15px;
  }
  a.note:hover { background: #e8edfa; transform: translateX(3px); }
  a.note .arrow { color: #9aa4bd; font-size: 13px; }
  #empty { color: #8a93a8; font-size: 14px; padding: 12px 0; }
  .hint { margin-top: 22px; font-size: 12.5px; color: #a0a8ba; line-height: 1.8; }
</style>
</head>
<body>
  <div class="card">
    <h1>我的笔记</h1>
    <div class="sub">Obsidian 导出 · 点击任意一篇查看（左侧有导航树）</div>
    <div id="list"><div id="empty">正在加载笔记列表…</div></div>
    <div class="hint">提示：进入任意页面后，左侧即为文件导航树，右上角可搜索。</div>
  </div>
  <script>
    fetch('site-lib/metadata.json')
      .then(function (r) { return r.json(); })
      .then(function (meta) {
        var list = document.getElementById('list');
        var files = (meta.shownInTree || []).filter(function (f) { return f.endsWith('.html'); });
        if (!files.length) {
          list.innerHTML = '<div id="empty">导出目录中没有页面，请重新导出。</div>';
          return;
        }
        files.forEach(function (f) {
          var label = decodeURIComponent(f.split('/').pop().replace(/\.html$/i, ''));
          var a = document.createElement('a');
          a.className = 'note';
          a.href = f;
          a.innerHTML = '<span></span><span class="arrow">→</span>';
          a.firstChild.textContent = label;
          list.appendChild(a);
        });
      })
      .catch(function () {
        document.getElementById('empty').textContent = '无法读取列表，请刷新重试。';
      });
  </script>
</body>
</html>
